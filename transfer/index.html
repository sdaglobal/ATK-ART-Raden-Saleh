<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Transfer Barang</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>

                📦 Transfer Barang

            </h1>

            <p>

                Transfer ATK / ART Antar Site

            </p>

        </div>

        <button
        class="btn-primary"
        id="btnTransfer">

            + Transfer Baru

        </button>

    </div>

        <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="card">

            <div class="card-title">

                Pending

            </div>

            <div
            id="totalPending"
            class="card-number">

                0

            </div>

        </div>


        <div class="card">

            <div class="card-title">

                Dikirim

            </div>

            <div
            id="totalKirim"
            class="card-number">

                0

            </div>

        </div>


        <div class="card">

            <div class="card-title">

                Diterima

            </div>

            <div
            id="totalTerima"
            class="card-number">

                0

            </div>

        </div>


        <div class="card">

            <div class="card-title">

                Total Transfer

            </div>

            <div
            id="totalTransfer"
            class="card-number">

                0

            </div>

        </div>

    </div>

        <!-- TABLE -->

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>No</th>

                    <th>No Transfer</th>

                    <th>Tanggal</th>

                    <th>Asal</th>

                    <th>Tujuan</th>

                    <th>Status</th>

                    <th>Aksi</th>

                </tr>

            </thead>

            <tbody
            id="transferBody">

            </tbody>

        </table>

    </div>

    </div>

<script src="config.js"></script>

<script src="utils.js"></script>

<script src="barang.js"></script>

<script src="transfer.js"></script>

<script src="histori.js"></script>

<script src="app.js"></script>

</body>

</html>
